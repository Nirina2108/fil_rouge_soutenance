# ============================================================
# application.properties — Configuration Spring Boot SkillHub Auth
# ============================================================
# Profil par défaut. Toutes les valeurs ${VAR:default} permettent de surcharger
# via variables d'environnement (Docker compose, GitHub Actions, etc.) sans
# toucher au code. Le fichier application-test.properties surcharge tout
# pendant les tests JUnit (DB H2 en mémoire, mail désactivé).
# ============================================================

# Nom de l'application — apparaît dans les logs Spring et les bannières.
spring.application.name=moustass-auth-service

# Port HTTP du serveur Tomcat embarqué. 8000 = port exposé dans Docker compose.
server.port=8000

# ─── Datasource MySQL ────────────────────────────────────────
# URL JDBC complète. createDatabaseIfNotExist=true crée tp5_auth_db au premier démarrage.
# useSSL=false + allowPublicKeyRetrieval=true requis pour MySQL 8 sans cert SSL.
# serverTimezone=UTC évite les problèmes de fuseau horaire entre JVM et MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/tp5_auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────
# update : Hibernate ajoute les colonnes manquantes au démarrage (jamais en prod stricte).
spring.jpa.hibernate.ddl-auto=update
# show-sql/format-sql à false : les logs SQL pollueraient les logs métier en prod.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Sécurité applicative ────────────────────────────────────
# SMK (Storage Master Key) : clé maître AES pour le chiffrement réversible des mots de passe.
# CRITIQUE — doit être générée aléatoirement et protégée comme un secret bancaire.
app.security.smk=${APP_SMK:moustass2024key!}

# Clé secrète pour signer les JWT (HS256 — doit faire au moins 32 caractères).
app.jwt.secret=${JWT_SECRET:moustass2024jwtsecretkeylongenough32chars}

# Durée de vie d'un token JWT en millisecondes. 900000 = 15 minutes.
# Court intentionnellement : un token volé n'est utilisable que 15 min.
app.jwt.expiration=900000

# URL publique de l'application — utilisée pour construire les liens dans les emails.
app.base.url=http://localhost:8000

# ─── Configuration mail (SMTP) ───────────────────────────────
# Gmail par défaut. En dev, MAIL_USERNAME/MAIL_PASSWORD vides = mails désactivés.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# STARTTLS : on monte la connexion en clair puis upgrade vers TLS (port 587 standard).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Spring Security ─────────────────────────────────────────
# DÉSACTIVÉ ici : on gère l'authentification nous-mêmes via JWT et HMAC custom,
# sans passer par les filtres Spring Security. Si activé, Spring imposerait
# une authentification basique sur tous les endpoints.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
