# ============================================================
# application-test.properties — Surcharges pour les tests JUnit
# ============================================================
# Activé via @ActiveProfiles("test") sur les classes de tests, ou
# automatiquement par Spring quand SPRING_PROFILES_ACTIVE=test.
# Surcharge les valeurs de application.properties pour isoler les tests
# de la base MySQL et du serveur SMTP réels.
# ============================================================

# ─── Base de données H2 en mémoire ───────────────────────────
# H2 in-memory : une DB éphémère par contexte de test, recréée à chaque run.
# DB_CLOSE_DELAY=-1 garde la DB ouverte tant que la JVM tourne (sinon
# elle se ferme à la fin de la première transaction).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop : Hibernate crée les tables au début et les drop à la fin (DB toujours fraîche).
spring.jpa.hibernate.ddl-auto=create-drop
# Dialecte H2 explicite (sinon Hibernate essaye de deviner et peut se tromper).
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ─── Secrets de test (déterministes pour la reproductibilité) ─
# Master Key pour les tests (AES réversible des mots de passe).
app.security.smk=moustass2024key!

# Cle secrete JWT pour les tests (>=32 caracteres pour HS256).
app.jwt.secret=moustass2024jwtsecretkeylongenough32chars

# Duree du JWT en millisecondes (15 minutes — meme valeur qu'en prod).
app.jwt.expiration=900000

# URL de base pour les tests (utilisee dans les liens emails generes).
app.base.url=http://localhost:8000

# ─── Désactivation du mail ───────────────────────────────────
# MailSenderAutoConfiguration : exclu pour eviter d'avoir besoin d'un SMTP reel.
# Les services qui appellent EmailService doivent etre mockes dans les tests.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
