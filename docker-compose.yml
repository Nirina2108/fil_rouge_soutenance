# ============================================================
# SkillHub — Stack complète (microservices)
# ============================================================
# Réseau interne isolé, health checks sur chaque service,
# limites mem/cpu, redémarrage automatique, secrets via .env.
# ============================================================

services:

  # ─── MySQL — base principale métier ───────────────────────
  mysql:
    image: mysql:8.0
    container_name: skillhub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skillhub}
    # Tuning InnoDB pour profiter de la limite memoire bumpee (1G).
    # Buffer pool 512M = ~50% de la RAM allouee, ratio recommande en dev.
    # Sans ce flag, MySQL alloue 128M par defaut et toutes les pages de
    # donnees sont lues du disque a chaque requete.
    command: >
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --max-connections=200
    ports:
      - "3307:3306"
    volumes:
      - skillhub_mysql_data:/var/lib/mysql
    networks:
      - skillhub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  # ─── MongoDB — logs activité + messages ───────────────────
  mongodb:
    image: mongo:7.0
    container_name: skillhub_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-skillhub_messages}
    ports:
      - "27017:27017"
    volumes:
      - skillhub_mongo_data:/data/db
    networks:
      - skillhub-net
    healthcheck:
      # Check TCP brut au lieu de mongosh : mongosh prend 3-5s à démarrer
      # et plus de 15s sous charge concurrente, ce qui produisait des
      # "unhealthy" intempestifs et bloquait depends_on. Le check TCP
      # vérifie juste que le port 27017 est ouvert (mongo accepte les connexions).
      # On invoque bash explicitement car /dev/tcp/ est une feature bash, pas sh.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/27017"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.8"

  # ─── Auth Service Spring Boot (HMAC challenge-response) ───
  # Service d'auth alternatif (POC). Utilise sa propre base
  # tp5_auth_db sur le MySQL partagé (créée à la volée via
  # createDatabaseIfNotExist=true).
  springboot:
    build:
      context: ./springboot
      dockerfile: Dockerfile
    container_name: skillhub_springboot
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tp5_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      APP_SECURITY_SMK: ${APP_SECURITY_SMK:-tp5-secret-key-2026}
      JWT_SECRET: ${JWT_SECRET_SPRING:-moustass2024jwtsecretkeylongenough32chars}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    networks:
      - skillhub-net
    healthcheck:
      # Test TCP brut : pas de wget/curl dans l'image temurin de base.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.8"

  # ─── Backend Laravel (API métier + JWT) ───────────────────
  skillhub-back:
    build:
      context: ./skillhub-back
      dockerfile: Dockerfile
    container_name: skillhub_back
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-skillhub}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-skillhub_messages}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_MAILER: ${MAIL_MAILER:-log}
    volumes:
      # Persiste les fichiers uploadés (PDF formations, photos profils) entre
      # rebuilds/down-up. Sans ce volume, un compose down purge tout le contenu
      # de storage/app/public/.
      - skillhub_back_storage:/app/storage/app/public
    networks:
      - skillhub-net
    healthcheck:
      # Laravel expose une route /up pour les health checks (depuis Laravel 11).
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://localhost:8001/up\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  # ─── Frontend React (Vite dev server) ─────────────────────
  # En dev local : on cible le stage "builder" du Dockerfile multi-stage
  # et on override la command pour lancer Vite en mode hot-reload.
  # En CI/prod : pas de target → build complet (nginx servant dist/).
  frontend:
    build:
      context: ./skillhub-front
      dockerfile: Dockerfile
      target: builder
    container_name: skillhub_front
    restart: unless-stopped
    depends_on:
      skillhub-back:
        condition: service_healthy
    ports:
      - "5173:5173"
    networks:
      - skillhub-net
    # Override : lance Vite dev plutôt que nginx (utile en local pour le HMR).
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    healthcheck:
      # On utilise 0.0.0.0 et pas localhost : busybox wget résout localhost
      # en IPv6 (::1) alors que Vite ne bind que sur IPv4 (0.0.0.0), ce qui
      # produisait un "Connection refused" → unhealthy permanent.
      test: ["CMD-SHELL", "wget -q --spider http://0.0.0.0:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.8"

# ─── Réseau interne isolé pour la communication inter-services
networks:
  skillhub-net:
    driver: bridge

# ─── Volumes nommés pour la persistance des données
# IMPORTANT : on fixe `name:` explicitement pour que le volume conserve le
# MEME nom sur l'hote, peu importe le nom du projet docker-compose. Sans ça,
# Docker prefixe le nom du projet (ex: skillhub_cicd_skillhub_mysql_data),
# et changer le nom du projet (ou du dossier) recree un volume vide en
# laissant l'ancien orphelin. Avec name: fixe, les donnees survivent
# a un renommage de dossier, un down/up, et un changement de COMPOSE_PROJECT_NAME.
volumes:
  skillhub_mysql_data:
    name: skillhub_mysql_persistent
  skillhub_mongo_data:
    name: skillhub_mongo_persistent
  # Persistance des fichiers uploadés via Laravel (Storage::disk('public')).
  skillhub_back_storage:
    name: skillhub_back_storage_persistent
